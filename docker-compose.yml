version: "3.9"

services:
  api:
    build: .
    container_name: rag_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./vectorstore:/app/vectorstore
      - ./data:/app/data
      - ./app.db:/app/app.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: python:3.11-slim
    container_name: rag_frontend
    working_dir: /app
    command: >
      sh -c "pip install streamlit httpx audio-recorder-streamlit -q &&
             streamlit run frontend/streamlit_app.py
             --server.port=8501
             --server.address=0.0.0.0
             --server.headless=true"
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app/frontend
    environment:
      - API_BASE=http://api:8000
      - BROWSER_API_BASE=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vectorstore:
  data:
